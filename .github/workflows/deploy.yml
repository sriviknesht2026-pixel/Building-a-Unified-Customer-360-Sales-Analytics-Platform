# .github/workflows/deploy.yml
# Continuous Deployment for ECRMDP (UC16)
#
# On every push to main:
#   1. Deploys the SQL schema (staging + star schema) to a fresh PostgreSQL database
#   2. Runs the gold validation SQL against it
#   3. Packages the project (Pentaho, SQL, Python, datasets, docs) as a downloadable bundle
# On every version tag (e.g. v1.0.0):
#   4. Publishes that bundle as a GitHub Release

name: ECRMDP Continuous Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to create GitHub Releases

jobs:
  deploy-database:
    name: Deploy schema to PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecrmdp
          POSTGRES_PASSWORD: ecrmdp
          POSTGRES_DB: ecrmdp_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ecrmdp
      PGPASSWORD: ecrmdp
      PGDATABASE: ecrmdp_dw

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy bronze staging tables
        run: psql -v ON_ERROR_STOP=1 -f "sql/TableCreation_DA_1_DE.sql"

      - name: Deploy star schema (dimensions + facts)
        run: psql -v ON_ERROR_STOP=1 -f "sql/Silver.sql"

      - name: Run gold validation
        run: psql -v ON_ERROR_STOP=1 -f "sql/gold_validation.sql"

      - name: List deployed tables
        run: psql -c "\dt"

  package:
    name: Build deployment bundle
    runs-on: ubuntu-latest
    needs: deploy-database      # only package if the DB deploy succeeded

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create bundle
        run: |
          mkdir -p dist
          zip -r dist/ecrmdp-bundle.zip \
            pentaho silver sql python datasets docs config README.md \
            -x "*.gitkeep"

      - name: Upload bundle as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecrmdp-bundle
          path: dist/ecrmdp-bundle.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ecrmdp-bundle.zip
          generate_release_notes: true
